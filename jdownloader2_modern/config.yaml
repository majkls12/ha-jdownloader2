name: JDownloader 2 Modern
version: "v26.07.2"
slug: jdownloader2_modern
description: Modern unofficial JDownloader 2 app based on the maintained jlesage container
url: https://github.com/majkls12/ha-jdownloader2
arch:
  - aarch64
  - amd64
startup: application
boot: manual
stage: experimental
init: false
image: jlesage/jdownloader-2
environment:
  USER_ID: "0"
  GROUP_ID: "0"
  UMASK: "0022"
  TZ: Europe/Prague
  KEEP_APP_RUNNING: "1"
  DARK_MODE: "1"
  DISPLAY_WIDTH: "1600"
  DISPLAY_HEIGHT: "900"
ports:
  5800/tcp: 5801
ports_description:
  5800/tcp: JDownloader web interface
webui: http://[HOST]:[PORT:5800]
map:
  - addon_config:rw
  - media:rw
options: {}
schema: {}
